<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:25px;font-weight:700}.b{font-size:20px;fill:#475467}.n{font-size:48px;font-weight:700;fill:#2563eb}</style><text x="70" y="85" class="t">Digital Phenotype Data Structure</text><text x="70" y="125" class="s">Symposium-stage dataset after feature engineering</text><rect x="70" y="185" width="300" height="150" rx="22" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="240" class="h">Participants</text><text x="105" y="300" class="n">1,000</text><text x="215" y="295" class="b">700 adults</text><text x="215" y="322" class="b">300 students</text><rect x="450" y="185" width="300" height="150" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/><text x="485" y="240" class="h">Model inputs</text><text x="485" y="300" class="n">42</text><text x="570" y="295" class="b">engineered features</text><rect x="830" y="185" width="300" height="150" rx="22" fill="#ecfdf3" stroke="#86efac"/><text x="865" y="240" class="h">Targets</text><text x="865" y="295" class="b">PHQ-9 · depression</text><text x="865" y="325" class="b">GAD-7 · anxiety</text><rect x="70" y="405" width="310" height="145" rx="22" fill="#f8fafc" stroke="#d0d5dd"/><text x="105" y="455" class="h">Passive logs</text><text x="105" y="500" class="b">Steps · distance · home-stay</text><text x="105" y="530" class="b">sleep duration</text><rect x="445" y="405" width="310" height="145" rx="22" fill="#f8fafc" stroke="#d0d5dd"/><text x="480" y="455" class="h">Active EMA</text><text x="480" y="500" class="b">Mood · appetite · sleep feeling</text><text x="480" y="530" class="b">general condition · symptoms</text><rect x="820" y="405" width="310" height="145" rx="22" fill="#f8fafc" stroke="#d0d5dd"/><text x="855" y="455" class="h">User profile</text><text x="855" y="500" class="b">Age · BMI · social relations</text><text x="855" y="530" class="b">socioeconomic status</text><text x="70" y="620" class="s">Daily records were ordered by date and represented as time-series sequences for LSTM prediction.</text></svg>