<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:22px;fill:#667085}.h{font-size:25px;font-weight:700}.b{font-size:21px;fill:#475467}</style><text x="70" y="85" class="t">Patient-Facing Monitoring Prototype</text><text x="70" y="125" class="s">Connecting daily data collection to personalized mental-health reporting</text><rect x="70" y="220" width="285" height="270" rx="26" fill="#eff6ff" stroke="#93c5fd"/><text x="105" y="280" class="h">1. Daily survey</text><text x="105" y="335" class="b">EMA responses</text><text x="105" y="372" class="b">behavioral records</text><text x="105" y="409" class="b">repeated over time</text><path d="M375 355H465" stroke="#2563eb" stroke-width="7"/><path d="M455 340l25 15-25 15" fill="#2563eb"/><rect x="480" y="220" width="285" height="270" rx="26" fill="#f5f3ff" stroke="#c4b5fd"/><text x="515" y="280" class="h">2. LSTM</text><text x="515" y="335" class="b">ordered time-series</text><text x="515" y="372" class="b">PHQ-9 / GAD-7</text><text x="515" y="409" class="b">prediction</text><path d="M785 355H875" stroke="#2563eb" stroke-width="7"/><path d="M865 340l25 15-25 15" fill="#2563eb"/><rect x="890" y="220" width="240" height="270" rx="26" fill="#ecfdf3" stroke="#86efac"/><text x="925" y="280" class="h">3. Report</text><text x="925" y="335" class="b">response history</text><text x="925" y="372" class="b">predicted trends</text><text x="925" y="409" class="b">personalized view</text><text x="70" y="600" class="s">The prototype was designed to support continuous self-monitoring and provide interpretable trend summaries outside the clinic.</text></svg>